name: Kod kontrolleri
on:
  push:
    branches: [main]
    paths-ignore: ['.github/keepalive']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - run: npm test
      - run: npm run eval
      - run: npm run test:build
      - run: npm run build:demo
      - name: Tarayıcıyı hazırla
        run: npx playwright install --with-deps chromium
      - name: Önizleme ve tarayıcı kontrolü
        run: |
          npm run preview > /tmp/meridyen-preview.log 2>&1 &
          npm run test:browser
      - name: Vercel ilk dağıtım derlemesi
        run: npm run build:vercel
        env:
          VERCEL: '1'
          VERCEL_ENV: production
          VERCEL_PROJECT_PRODUCTION_URL: meridyen.test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tasarim-ve-kontroller
          path: artifacts/
