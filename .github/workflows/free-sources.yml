name: Ücretsiz kaynak akışı
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths: ['free-sources.json', 'scripts/refresh-free-feed.mjs', 'lib/free-feed.mjs', 'lib/rss.mjs', '.github/workflows/free-sources.yml']
permissions:
  contents: write
concurrency:
  group: free-sources
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run sources:refresh
      - name: Yeni kaynak kayıtlarını kaydet
        run: |
          if git diff --quiet -- data/free-feed.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/free-feed.json
          git commit -m 'Update free source feed'
          git push origin HEAD:main
