name: Model bağlantı kontrolü
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config.js', 'lib/llm.mjs', 'scripts/check-model-access.mjs', '.github/workflows/model-access.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - name: Gemini ve isteğe bağlı Groq erişimi
        run: node scripts/check-model-access.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: model-baglanti-durumu
          path: artifacts/model-access.json
          retention-days: 7
